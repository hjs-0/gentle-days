<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gentle Days</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head>
<body><div class="wrap"><div class="stage" id="stage">
<div class="a cal"><div class="calhead"><button class="nav" id="prev" aria-label="Previous month">‹</button><b id="mlabel"></b><button class="nav" id="next" aria-label="Next month">›</button></div><div class="dow"><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span></div><div class="grid" id="grid"></div></div>
<div class="a log" id="log"></div>
<div class="a todo"><h2>To Do</h2><input type="text" id="tin" placeholder="add a task…"><div class="tl" id="tl"></div></div>
<textarea class="a sn" id="n0" placeholder="a gentle reminder…" style="left:9.9%;top:77.8%;width:11.2%;height:15.3%"></textarea>
<textarea class="a sn" id="n1" placeholder="a gentle reminder…" style="left:29.7%;top:78.7%;width:9.9%;height:13.9%;transform:rotate(22deg)"></textarea>
<textarea class="a sn" id="n2" placeholder="a gentle reminder…" style="left:47.1%;top:78.7%;width:10.4%;height:13.9%;transform:rotate(-7deg)"></textarea>
<div class="modal" id="modal"><div class="mcard"><button class="x" id="mx" aria-label="Close">×</button><div class="log" id="mbody"></div></div></div>
<button class="a sbtn" id="ibtn">Last 30 Days<small>See your patterns</small></button>
<div class="modal" id="imodal"><div class="mcard"><button class="x" id="ix" aria-label="Close">×</button><div id="ibody"></div></div></div>
<button class="a out" id="out" style="display:none"></button>
<div id="toast" role="status"></div>
<div class="modal" id="auth"><div class="mcard"><h2>Gentle Days</h2><div class="sub">log in, or make an account to start tracking</div><div id="aerr"></div>
<input type="text" id="ae" placeholder="email" autocomplete="email"><input type="password" id="ap" placeholder="password (8+ characters)" autocomplete="current-password"><input type="text" id="an" placeholder="your name (optional, sign-up only)" maxlength="40">
<div class="row"><button class="save" id="ali">Log in</button><button class="save" id="asu">Sign up</button></div></div></div>
</div></div>
<script src="app.js"></script></body></html>
